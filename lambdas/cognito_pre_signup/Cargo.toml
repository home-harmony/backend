[package]
name = "cognito_pre_signup"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FamilyLedger — Cognito PreSignUp Lambda for safe Google account linking and takeover prevention."

[[bin]]
name = "cognito_pre_signup"
