[package]
name = "migrate_runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FamilyLedger — Lambda function that applies Aurora DSQL schema migrations at deploy time."

# Compiled as a custom runtime binary for AWS Lambda (ARM64).
# Build with: cargo lambda build --release --arm64 --package migrate_runner
# Outputs: target/lambda/migrate_runner/bootstrap
[[bin]]
name = "migrate_runner"
path = "src/main.rs"

[dependencies]
infrastructure = { path = "../../infrastructure" }

# ── Lambda runtime ─────────────────────────────────────────────────────────────
lambda_runtime = { workspace = true }

# ── Async runtime ─────────────────────────────────────────────────────────────
tokio = { workspace = true }

# ── Serialization ─────────────────────────────────────────────────────────────
serde = { workspace = true }
serde_json = { workspace = true }

# ── Error handling ────────────────────────────────────────────────────────────
anyhow = { workspace = true }

# ── Observability ─────────────────────────────────────────────────────────────
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
