[package]
name = "domain"
version = "0.1.0"
edition = "2024"
description = "FamilyLedger — pure domain logic, entities, value objects, and invariants. Zero I/O dependencies."

# ─── Dependencies ─────────────────────────────────────────────────────────────
# RULE: This crate must have ZERO database, HTTP, or I/O dependencies.
# Everything here must be unit-testable without any network or filesystem access.
[dependencies]
rust_decimal = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rust_decimal_macros = { workspace = true }
