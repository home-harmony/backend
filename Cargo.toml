[workspace]
members = ["domain", "infrastructure", "api", "lambdas/migrate_runner", "lambdas/cognito_pre_signup"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# ─── Workspace-level dependency versions ──────────────────────────────
# Define versions here once; crates opt-in with `dep-name.workspace = true`.
# This prevents version mismatches between crates.
[workspace.dependencies]

# ─── Async runtime ───────────────────────────────────────────────────
tokio = { version = "1.54.1", features = ["full"] }

# ─── Database ────────────────────────────────────────────────────────
sqlx = { version = "0.9.0", features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "rust_decimal",
    "json",
] }
aurora-dsql-sqlx-connector = { version = "0.2.2", features = ["pool", "occ"] }

# ─── Domain types ────────────────────────────────────────────────────
# rust_decimal: float-free exact decimal arithmetic for money.
# RULE: Money is ALWAYS rust_decimal::Decimal, never f64/f32.
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }
rust_decimal_macros = "1.40.0"

# uuid: v4 for most PKs, v7 for transaction IDs (time-sortable → keyset pagination).
uuid = { version = "1.29.3", features = ["v4", "v7", "serde"] }

# ─── Date/time ───────────────────────────────────────────────────────
chrono = { version = "0.4.45", features = ["serde"] }

# ─── Serialization ───────────────────────────────────────────────────
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# ─── HTTP / Lambda / AWS SDK ─────────────────────────────────────────────────
axum = { version = "0.8.9", features = ["macros"] }
lambda_runtime = "1.5.0"
lambda_http = { version = "1.3.2", default-features = false, features = ["apigw_http"] }
aws_lambda_events = { version = "1.2.0", default-features = false, features = ["cognito"] }
aws-config = "1.11.0"
aws-sdk-cognitoidentityprovider = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["set-header"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }

# ─── Observability ───────────────────────────────────────────────────
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# ─── Error handling ───────────────────────────────────────────────────
thiserror = "2.0.21"
anyhow = "1.0.104"

# ─── Base64 (cursor encoding for keyset pagination) ────────────────────
base64 = "0.23.1"

# ─── Value objects (strongly-typed primitives with built-in validation) ─────────
nutype = { version = "0.8.0", features = ["serde"] }
email_address = { version = "0.2.9", default-features = false }
sha2 = { version = "0.10.9", default-features = false }

# ─── Testing ─────────────────────────────────────────────────────────────────
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
