AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: "FamilyLedger — Database Streaming, EventBridge Bus, and IAM Execution Roles"

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment name

  DsqlClusterIdentifier:
    Type: String
    Description: Aurora DSQL Cluster Identifier (e.g. 4bublzlvvtnwjpmgtotwrulv7m)

  DeployKinesisStream:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Whether to deploy the Kinesis Data Stream. Set to false during early development
      (Sprints 1-3) to avoid hourly stream charges ($0.04/hr On-Demand or $0.015/hr Provisioned).

  KinesisCapacityMode:
    Type: String
    Default: PROVISIONED
    AllowedValues: [PROVISIONED, ON_DEMAND]
    Description: >-
      Kinesis capacity mode. Use PROVISIONED (1 shard) in dev to save 63% on baseline cost ($0.015/hr),
      or ON_DEMAND in prod for automatic scaling.

  KinesisShardCount:
    Type: Number
    Default: 1
    Description: Number of shards for PROVISIONED mode (ignored if ON_DEMAND or DeployKinesisStream=false).

Conditions:
  ShouldDeployKinesis: !Equals [!Ref DeployKinesisStream, "true"]
  IsOnDemand: !And
    - !Equals [!Ref DeployKinesisStream, "true"]
    - !Equals [!Ref KinesisCapacityMode, "ON_DEMAND"]
  IsProvisioned: !And
    - !Equals [!Ref DeployKinesisStream, "true"]
    - !Equals [!Ref KinesisCapacityMode, "PROVISIONED"]

Resources:
  # ─── Kinesis Data Stream for Aurora DSQL CDC (Conditional) ───────────────────
  FamilyLedgerCdcStream:
    Type: AWS::Kinesis::Stream
    Condition: ShouldDeployKinesis
    Properties:
      Name: !Sub "familyledger-cdc-stream-${Environment}"
      StreamModeDetails: !If
        - IsOnDemand
        - StreamMode: ON_DEMAND
        - !Ref "AWS::NoValue"
      ShardCount: !If
        - IsProvisioned
        - !Ref KinesisShardCount
        - !Ref "AWS::NoValue"
      StreamEncryption:
        EncryptionType: KMS
        KeyId: alias/aws/kinesis

  # ─── Custom EventBridge Event Bus ───────────────────────────────────────────
  FamilyLedgerEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "familyledger-events-${Environment}"

  # ─── IAM Role for Rust Microservices (DSQL + EventBridge) ───────────────────
  FamilyLedgerServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "familyledger-service-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AuroraDSQLAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: "AllowDSQLDbConnect"
                Effect: Allow
                Action:
                  - dsql:DbConnect
                  - dsql:DbConnectAdmin
                Resource:
                  - !Sub "arn:aws:dsql:${AWS::Region}:${AWS::AccountId}:cluster/${DsqlClusterIdentifier}"
        - PolicyName: EventBridgePublishAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: "AllowEventBusPutEvents"
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !GetAtt FamilyLedgerEventBus.Arn

  # ─── IAM Role for Migration Runner Lambda ────────────────────────────────────
  FamilyLedgerMigrationRunnerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "familyledger-migration-runner-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AuroraDSQLAdminAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: "AllowDSQLDbConnectAdmin"
                Effect: Allow
                Action:
                  - dsql:DbConnect
                  - dsql:DbConnectAdmin
                Resource:
                  - !Sub "arn:aws:dsql:${AWS::Region}:${AWS::AccountId}:cluster/${DsqlClusterIdentifier}"

Outputs:
  CdcStreamArn:
    Condition: ShouldDeployKinesis
    Value: !GetAtt FamilyLedgerCdcStream.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CdcStreamArn"
  CdcStreamName:
    Condition: ShouldDeployKinesis
    Value: !Ref FamilyLedgerCdcStream
    Export:
      Name: !Sub "${AWS::StackName}-CdcStreamName"
  EventBusArn:
    Value: !GetAtt FamilyLedgerEventBus.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EventBusArn"
  EventBusName:
    Value: !Ref FamilyLedgerEventBus
    Export:
      Name: !Sub "${AWS::StackName}-EventBusName"
  ServiceRoleArn:
    Value: !GetAtt FamilyLedgerServiceRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ServiceRoleArn"
  MigrationRunnerRoleArn:
    Value: !GetAtt FamilyLedgerMigrationRunnerRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-MigrationRunnerRoleArn"