AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: "FamilyLedger — EventBridge Bus, IAM Execution Roles, and Migration Runner Lambda"

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment name

  DsqlClusterIdentifier:
    Type: String
    Description: Aurora DSQL Cluster Identifier (e.g. exampleclusterid1234567890)

Resources:
  # ─── Custom EventBridge Event Bus ───────────────────────────────────────────
  FamilyLedgerEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "familyledger-events-${Environment}"

  # ─── IAM Role for Rust Microservices (DSQL + EventBridge) ───────────────────
  FamilyLedgerServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "familyledger-service-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AuroraDSQLAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: "AllowDSQLDbConnect"
                Effect: Allow
                Action:
                  - dsql:DbConnect
                Resource:
                  - !Sub "arn:aws:dsql:${AWS::Region}:${AWS::AccountId}:cluster/${DsqlClusterIdentifier}"
        - PolicyName: EventBridgePublishAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: "AllowEventBusPutEvents"
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !GetAtt FamilyLedgerEventBus.Arn

  # ─── IAM Role for Migration Runner Lambda ────────────────────────────────────
  FamilyLedgerMigrationRunnerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "familyledger-migration-runner-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AuroraDSQLAdminAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: "AllowDSQLDbConnectAdmin"
                Effect: Allow
                Action:
                  - dsql:DbConnect
                  - dsql:DbConnectAdmin
                Resource:
                  - !Sub "arn:aws:dsql:${AWS::Region}:${AWS::AccountId}:cluster/${DsqlClusterIdentifier}"

  # ─── Migration Runner Lambda ─────────────────────────────────────────────────
  FamilyLedgerMigrateRunnerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "familyledger-migrate-${Environment}"
      Description: "Applies embedded Aurora DSQL schema migrations at deploy time"
      CodeUri: ../../target/lambda/migrate_runner/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Role: !GetAtt FamilyLedgerMigrationRunnerRole.Arn
      MemorySize: 256
      Timeout: 120
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DSQL_ENDPOINT: !Sub "${DsqlClusterIdentifier}.dsql.${AWS::Region}.on.aws"
          RUST_LOG: info

Outputs:
  EventBusArn:
    Value: !GetAtt FamilyLedgerEventBus.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EventBusArn"
  EventBusName:
    Value: !Ref FamilyLedgerEventBus
    Export:
      Name: !Sub "${AWS::StackName}-EventBusName"
  ServiceRoleArn:
    Value: !GetAtt FamilyLedgerServiceRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ServiceRoleArn"
  MigrationRunnerRoleArn:
    Value: !GetAtt FamilyLedgerMigrationRunnerRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-MigrationRunnerRoleArn"
  MigrateRunnerFunctionName:
    Value: !Ref FamilyLedgerMigrateRunnerFunction
    Export:
      Name: !Sub "${AWS::StackName}-MigrateRunnerFunctionName"
  MigrateRunnerFunctionArn:
    Value: !GetAtt FamilyLedgerMigrateRunnerFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-MigrateRunnerFunctionArn"