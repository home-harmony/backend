AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: "FamilyLedger — Core serverless infrastructure (Cognito + Google IdP, PreSignUp, S3, CloudFront)"

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment name

  CognitoCallbackUrl:
    Type: String
    Default: http://localhost:4200/auth/callback
    AllowedPattern: "^(https://.+|http://localhost:4200/.*)$"
    Description: URL that Cognito redirects to after login (HTTPS required outside local dev).

  CognitoLogoutUrl:
    Type: String
    Default: http://localhost:4200/auth/logout
    AllowedPattern: "^(https://.+|http://localhost:4200/.*)$"
    Description: URL that Cognito redirects to after logout (HTTPS required outside local dev).

  GoogleClientId:
    Type: String
    Default: ""
    Description: Optional Google OAuth 2.0 Web Client ID for Cognito federation (leave empty to disable Google IdP).

  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional Google OAuth 2.0 Web Client Secret (never commit to git or samconfig).

  CognitoAdvancedSecurityMode:
    Type: String
    Default: AUDIT
    AllowedValues: [OFF, AUDIT, ENFORCED]
    Description: Cognito threat protection mode (AUDIT in dev; ENFORCED recommended for prod).

Conditions:
  IsDev: !Equals [!Ref Environment, dev]
  HasGoogleIdp: !Not [!Equals [!Ref GoogleClientId, ""]]

Resources:
  # ─── Cognito PreSignUp Safe Account-Linking Lambda ──────────────────────────
  CognitoPreSignUpRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "familyledger-cognito-pre-signup-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoPreSignUpUserPoolAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: "AllowScopedCognitoAccountLinking"
                Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminLinkProviderForUser
                  - cognito-idp:AdminDeleteUser
                Resource:
                  - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/Project": "FamilyLedger"
                    "aws:ResourceTag/Environment": !Ref Environment

  CognitoPreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "familyledger-cognito-pre-signup-${Environment}"
      Description: "Safe Google OAuth PreSignUp account linking and takeover stub cleanup"
      CodeUri: ../../target/lambda/cognito_pre_signup/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      Role: !GetAtt CognitoPreSignUpRole.Arn
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          RUST_LOG: info

  CognitoPreSignUpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CognitoPreSignUpFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt FamilyLedgerUserPool.Arn

  # ─── Cognito User Pool ───────────────────────────────────────────────────────
  FamilyLedgerUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "familyledger-users-${Environment}"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: "Your FamilyLedger verification code"
        EmailMessage: "Your verification code is {####}"
      UserPoolAddOns:
        AdvancedSecurityMode: !Ref CognitoAdvancedSecurityMode
      LambdaConfig:
        PreSignUp: !GetAtt CognitoPreSignUpFunction.Arn
      UserPoolTags:
        Environment: !Ref Environment
        Project: FamilyLedger

  # ─── Google OIDC Identity Provider (Optional) ───────────────────────────────
  FamilyLedgerGoogleIdp:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogleIdp
    Properties:
      UserPoolId: !Ref FamilyLedgerUserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name

  # ─── Cognito App Client ─────────────────────────────────────────────────────
  FamilyLedgerWebAppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "familyledger-web-${Environment}"
      UserPoolId: !Ref FamilyLedgerUserPool
      GenerateSecret: false
      SupportedIdentityProviders: !If
        - HasGoogleIdp
        - [COGNITO, !Ref FamilyLedgerGoogleIdp]
        - [COGNITO]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - !Ref CognitoCallbackUrl
      LogoutURLs:
        - !Ref CognitoLogoutUrl
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  FamilyLedgerUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "familyledger-${Environment}-${AWS::AccountId}"
      UserPoolId: !Ref FamilyLedgerUserPool

  # ─── S3 Bucket for Angular SPA ──────────────────────────────────────────────
  FamilyLedgerSpaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "familyledger-spa-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  # ─── CloudFront OAC & Security Headers ──────────────────────────────────────
  FamilyLedgerCdnOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "familyledger-oac-${Environment}"
        Description: "OAC for FamilyLedger SPA bucket"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FamilyLedgerSecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "familyledger-security-headers-${Environment}"
        Comment: "Strict security headers for FamilyLedger Angular SPA"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.execute-api.*.amazonaws.com https://cognito-idp.*.amazonaws.com https://*.amazoncognito.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true

  FamilyLedgerSpaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FamilyLedgerSpaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowCloudFrontServicePrincipal"
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FamilyLedgerSpaBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FamilyLedgerCdn}"

  # ─── CloudFront Distribution ────────────────────────────────────────────────
  FamilyLedgerCdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "FamilyLedger Angular SPA CDN — ${Environment}"
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: S3SpaOrigin
            DomainName: !GetAtt FamilyLedgerSpaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FamilyLedgerCdnOac.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3SpaOrigin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref FamilyLedgerSecurityHeadersPolicy
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

Outputs:
  CognitoUserPoolId:
    Value: !Ref FamilyLedgerUserPool
    Export:
      Name: !Sub "${AWS::StackName}-CognitoUserPoolId"
  CognitoWebAppClientId:
    Value: !Ref FamilyLedgerWebAppClient
    Export:
      Name: !Sub "${AWS::StackName}-CognitoWebClientId"
  CognitoPreSignUpFunctionArn:
    Value: !GetAtt CognitoPreSignUpFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CognitoPreSignUpFunctionArn"
  CloudFrontUrl:
    Value: !Sub "https://${FamilyLedgerCdn.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontUrl"
