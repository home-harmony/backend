[package]
name = "infrastructure"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FamilyLedger — database repositories, external service adapters, and I/O wrappers."

[features]
test-utils = []

[dependencies]
domain = { path = "../domain" }

# ── AWS SDK ────────────────────────────────────────────────────────────────────
aws-config = { workspace = true }
aws-sdk-eventbridge = { workspace = true }

# ── Database ───────────────────────────────────────────────────────────────────
sqlx = { workspace = true }
aurora-dsql-sqlx-connector = { workspace = true }

# ── Async runtime ─────────────────────────────────────────────────────────────
tokio = { workspace = true }

# ── Serialization ─────────────────────────────────────────────────────────────
serde = { workspace = true }
serde_json = { workspace = true }

# ── Domain types ──────────────────────────────────────────────────────────────
uuid = { workspace = true }
chrono = { workspace = true }

# ── Error handling ────────────────────────────────────────────────────────────
anyhow = { workspace = true }

# ── Base64 for cursor encoding ────────────────────────────────────────────────
base64 = { workspace = true }

# ── Observability ─────────────────────────────────────────────────────────────
tracing = { workspace = true }

[dev-dependencies]
# DB integration tests run against a real PostgreSQL via testcontainers.
# RULE (testing-strategy.md): Do NOT mock database behavior in integration layers.
testcontainers-modules = { workspace = true }

[lints]
workspace = true
